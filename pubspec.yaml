name: settleup_lite
description: A minimal Flutter app for UPI-first group settlements.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cloud_firestore: ^6.2.0
  firebase_auth: ^6.3.0
  firebase_core: ^4.6.0
  flutter_contacts: ^2.0.2
  google_sign_in: ^7.2.0
  provider: ^6.1.2
  qr_flutter: ^4.1.0
  share_plus: ^10.0.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
