name: bharat_dues
description: A minimal Flutter app for UPI-first group settlements (Bharat Dues).
publish_to: "none"

version: 1.0.6

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cloud_firestore: ^6.2.0
  firebase_auth: ^6.3.0
  firebase_core: ^4.6.0
  flutter_contacts: ^2.0.2
  google_sign_in: ^6.2.1
  provider: ^6.1.2
  qr_flutter: ^4.1.0
  share_plus: ^10.0.2
  url_launcher: ^6.3.1
  firebase_messaging: ^16.1.3
  http: ^1.2.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
